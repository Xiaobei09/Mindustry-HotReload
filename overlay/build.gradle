//HOTRELOAD: the overlay mod project. Standalone Java mod compiled against this repo's core.
apply plugin: 'java'

tasks.withType(JavaCompile){
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
    options.encoding = 'UTF-8'
}

dependencies{
    //compile against the local game core; never bundle it
    compileOnly project(':core')
}

//package the overlay as a regular Mindustry mod jar
jar{
    archiveFileName = 'overlay.jar'
    from('mod.hjson', 'content', 'sprites')
}

//deploy the overlay as a *directory mod* into the dev data dir used by :desktop:hotreloadRun.
//Directory mods let you tweak content/*.json|hjson files and have them hot-reloaded without re-jarring.
tasks.register('syncDev', Copy){
    dependsOn classes
    into "${rootProject.projectDir}/devdata/mods/overlay"
    from('mod.hjson')
    from('content'){ into 'content' }
    from('sprites'){ into 'sprites' }
    from(sourceSets.main.output.classesDirs){ into '.' }
    doFirst{
        delete "${rootProject.projectDir}/devdata/mods/overlay"
    }
    doLast{
        println "Overlay deployed to devdata/mods/overlay (editable + hot-reloadable)."
    }
}