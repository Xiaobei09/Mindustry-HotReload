# HOTRELOAD: mirror upstream release tags, build, and publish releases.
#  - nightly (prerelease): daily 02:00 UTC + manual dispatch.
#  - stable (v-tag): when upstream tags a new release (e.g. v159.7), the newest
#    upstream v-tag is mirrored onto this repo (via PAT so it triggers CI) and a
#    matching stable release is built from OUR master (fork code + hot-reload patches).
name: Sync & Release

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 daily
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror upstream tags
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.tags.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The fork has rewritten history (unrelated to upstream), so we do NOT merge
      # upstream master anymore — we only mirror its release tags.
      - name: Fetch upstream tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/Anuken/Mindustry.git || true
          git fetch upstream 'refs/tags/v*:refs/tags/upstream/*' --no-tags
          NEWEST=$(git tag -l 'upstream/*' | sed 's|^upstream/||' | sort -V | tail -1)
          echo "Newest upstream stable tag: $NEWEST"
          if [ -z "$NEWEST" ]; then
            echo "::error::No upstream v-tags found."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$NEWEST" >/dev/null 2>&1; then
            echo "Tag $NEWEST already mirrored."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$NEWEST" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push with the PAT (not GITHUB_TOKEN): pushes by GITHUB_TOKEN do not trigger
      # workflows, so the stable build would never run. The tag is created on OUR
      # master commit (not the upstream tag object) — pushing upstream's own commits
      # would require the 'workflows' permission since they contain CI files.
      - name: Push newest tag (triggers stable build)
        if: steps.tags.outputs.changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          NEWEST="${{ steps.tags.outputs.tag }}"
          git tag -f "$NEWEST" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" \
            "refs/tags/$NEWEST:refs/tags/$NEWEST"

  build:
    name: Build & publish nightly
    needs: sync
    if: always() && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish nightly release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Built from this fork's master with the in-process hot-swap agent.

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's `mods` directory to enable live content editing.

          > Nightly pre-release. For tagged stable builds matching upstream releases, see the Releases page.
          NOTES
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            dist/Mindustry-HotReload.jar \
            dist/Mindustry-HotReload-server.jar \
            dist/hotreload-agent.jar \
            dist/mods-overlay.zip \
            --title "Nightly hot-reload build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease

  build-stable:
    name: Build & publish stable (v-tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Many mirrored tags at once would trigger one run per tag; only build the newest.
    concurrency:
      group: stable-release
      cancel-in-progress: true
    steps:
      # Build from OUR master (fork + hot-reload patches), not from the upstream tag commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > notes.md <<NOTES
          Stable hot-reload build for upstream release **$TAG** (built from this fork's master).

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's \`mods\` directory to enable live content editing.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets."
            gh release upload "$TAG" \
              dist/Mindustry-HotReload.jar \
              dist/Mindustry-HotReload-server.jar \
              dist/hotreload-agent.jar \
              dist/mods-overlay.zip \
              --clobber
          else
            gh release create "$TAG" \
              dist/Mindustry-HotReload.jar \
              dist/Mindustry-HotReload-server.jar \
              dist/hotreload-agent.jar \
              dist/mods-overlay.zip \
              --title "Hot-reload build $TAG" \
              --notes-file notes.md
          fi

  notify:
    name: Notify on failure
    if: failure()
    runs-on: ubuntu-latest
    needs: [sync, build, build-stable]
    steps:
      - name: Comment on latest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Sync/build/release failed" \
            --body "The upstream sync, nightly build or stable release failed. Check the workflow runs for details." || true