# HOTRELOAD: sync upstream Mindustry, build, and publish releases.
#  - nightly (prerelease): daily 02:00 UTC + manual dispatch.
#  - stable (v-tag): when upstream tags a new release (e.g. v159.7), we mirror the tag
#    and publish a matching stable release.
name: Sync & Release

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 daily
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/Anuken/Mindustry.git || true
          git fetch upstream master --tags
          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit --no-ff upstream/master || {
            echo "::error::Merge conflict with upstream. Resolve manually on branch master."
            exit 1
          }
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git log --oneline -5
          fi

      - name: Push merged changes
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      - name: Mirror upstream version tags
        run: |
          git push origin --tags --follow-tags 2>/dev/null || git push origin --tags

  build:
    name: Build & publish nightly
    needs: sync
    if: always() && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish nightly release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Automatically synced from upstream [Anuken/Mindustry](https://github.com/Anuken/Mindustry) and built with the in-process hot-swap agent.

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's `mods` directory to enable live content editing.

          > Nightly pre-release. For tagged stable builds matching upstream releases, see the Releases page.
          NOTES
          VERSION="v$(date -u +%Y.%m.%d)"
          gh release delete nightly --yes || true
          gh release create nightly \
            dist/Mindustry-HotReload.jar \
            dist/Mindustry-HotReload-server.jar \
            dist/hotreload-agent.jar \
            dist/mods-overlay.zip \
            --title "Nightly hot-reload build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease

  build-stable:
    name: Build & publish stable (v-tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > notes.md <<'NOTES'
          Stable hot-reload build matching upstream release **$TAG**.

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's `mods` directory to enable live content editing.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets."
            gh release upload "$TAG" \
              dist/Mindustry-HotReload.jar \
              dist/Mindustry-HotReload-server.jar \
              dist/hotreload-agent.jar \
              dist/mods-overlay.zip \
              --clobber
          else
            gh release create "$TAG" \
              dist/Mindustry-HotReload.jar \
              dist/Mindustry-HotReload-server.jar \
              dist/hotreload-agent.jar \
              dist/mods-overlay.zip \
              --title "Hot-reload build $TAG" \
              --notes-file notes.md
          fi

  notify:
    name: Notify on failure
    if: failure()
    runs-on: ubuntu-latest
    needs: [sync, build, build-stable]
    steps:
      - name: Comment on latest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Sync/build/release failed" \
            --body "The upstream sync, nightly build or stable release failed. Check the workflow runs for details." || true