# HOTRELOAD: mirror upstream release tags, build, and publish releases.
#  - stable (v-tag): when upstream tags a new release (e.g. v159.7), the newest
#    upstream v-tag is mirrored onto this repo and a matching stable release is
#    built from OUR master (fork code + hot-reload patches).
#  - nightly (prerelease): published whenever a new upstream version was picked up,
#    or on manual dispatch.
#
# Note: the fork's history is independent of upstream (rewritten), so we never merge
# upstream code — we only mirror its version tags. Tag pushes are done with the
# default GITHUB_TOKEN inside this workflow (they intentionally do NOT trigger other
# workflows; the build happens right here in the same job).
name: Sync & Release

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 daily
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Publish releases for ALL upstream v-tags missing one (not just newest)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  stable:
    name: Mirror newest upstream tag & publish stable
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.tags.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Find missing upstream tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ inputs.backfill || false }}
        run: |
          ALL=$(git ls-remote --tags --refs https://github.com/Anuken/Mindustry.git 'v*' \
            | awk -F'/' '{print $NF}' | sort -V | uniq)
          NEWEST=$(echo "$ALL" | tail -1)
          echo "Newest upstream stable tag: $NEWEST"
          if [ -z "$NEWEST" ]; then
            echo "::error::No upstream v-tags found."
            exit 1
          fi

          MISSING=""
          for t in $ALL; do
            git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1 && continue
            # backfill mode: every tag without a release; normal mode: newest only
            if [ "$BACKFILL" = "true" ] || ! gh release view "$t" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              MISSING="$MISSING $t"
            fi
          done
          # normal (non-backfill) mode only ever adds the newest tag
          if [ "$BACKFILL" != "true" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$NEWEST" >/dev/null 2>&1 \
               || gh release view "$NEWEST" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              MISSING=""
            else
              MISSING="$NEWEST"
            fi
          fi

          if [ -z "${MISSING// /}" ]; then
            echo "Nothing to mirror — all handled."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing tags:$MISSING"
            echo "list=${MISSING# }" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Tag our own master commit with the upstream version numbers.
      # (Pushing upstream's actual tag objects would require 'workflows' permission,
      #  since their commits contain CI files.)
      - name: Mirror tags onto our master
        if: steps.tags.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in ${{ steps.tags.outputs.list }}; do
            git tag -f "$t" "$GITHUB_SHA"
            git push origin "refs/tags/$t:refs/tags/$t"
          done

      - uses: actions/setup-java@v4
        if: steps.tags.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        if: steps.tags.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        if: steps.tags.outputs.changed == 'true'
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        if: steps.tags.outputs.changed == 'true'
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish stable releases
        if: steps.tags.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Stable hot-reload build for upstream release **__TAG__** (built from this fork's master).

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's `mods` directory to enable live content editing.

          > The jar is built from this fork's current master; the version number mirrors the upstream release for tracking.
          NOTES
          ASSETS=(dist/Mindustry-HotReload.jar dist/Mindustry-HotReload-server.jar dist/hotreload-agent.jar dist/mods-overlay.zip)
          for TAG in ${{ steps.tags.outputs.list }}; do
            sed "s/__TAG__/$TAG/g" notes.md > notes-final.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists, updating assets."
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "Hot-reload build $TAG" \
                --notes-file notes-final.md
            fi
          done

  nightly:
    name: Build & publish nightly
    needs: stable
    if: always() && (needs.stable.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build game, server, hot-swap agent and overlay
        run: ./gradlew :desktop:dist :server:dist :hotreload-agent:jar :overlay:syncDev --no-daemon

      - name: Package artifacts
        run: |
          mkdir -p dist/mods
          cp desktop/build/libs/Mindustry.jar dist/Mindustry-HotReload.jar
          cp server/build/libs/server-release.jar dist/Mindustry-HotReload-server.jar
          cp hotreload-agent/build/libs/hotreload-agent.jar dist/
          cp -r devdata/mods/overlay dist/mods/overlay
          (cd dist && zip -r mods-overlay.zip mods/overlay && rm -rf mods)
          ls -la dist/

      - name: Publish nightly release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Built from this fork's master with the in-process hot-swap agent.

          ## What's inside
          - **Mindustry-HotReload.jar** — full game with the HOTRELOAD runtime overlay reload built in.
          - **Mindustry-HotReload-server.jar** — headless server (supports overlay content too).
          - **hotreload-agent.jar** — attach it to a running JVM to hot-swap logic changes without restarting.
          - **mods/overlay/** — drop this folder into your game's `mods` directory to enable live content editing.

          > Nightly pre-release. For tagged stable builds matching upstream releases, see the Releases page.
          NOTES
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            dist/Mindustry-HotReload.jar \
            dist/Mindustry-HotReload-server.jar \
            dist/hotreload-agent.jar \
            dist/mods-overlay.zip \
            --title "Nightly hot-reload build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease

  notify:
    name: Notify on failure
    if: failure()
    runs-on: ubuntu-latest
    needs: [stable, nightly]
    steps:
      - name: Comment on latest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Sync/build/release failed" \
            --body "The upstream sync, nightly build or stable release failed. Check the workflow runs for details." || true